<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyEdge — Copy-Trade Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1>POLYEDGE</h1>
        <div class="badge">Copy Trade Research</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <div class="nav-item active" data-tab="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>Overview</span>
        </div>
        <div class="nav-item" data-tab="wallets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4h-4z"/></svg>
          <span>Wallets</span>
        </div>
        <div class="nav-item" data-tab="trades">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          <span>Trades</span>
        </div>
        <div class="nav-item" data-tab="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Analytics</span>
        </div>
        <div class="nav-item" data-tab="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span>Settings / Log</span>
        </div>
      </nav>
      <div class="sidebar-footer" id="sidebar-footer">
        <span class="status-dot offline" id="status-dot"></span>
        <span id="last-scan-text">No scans yet</span>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content" id="main-content">
      <div class="loading" id="initial-loading">Loading dashboard data...</div>
    </main>

    <!-- Wallet Detail Overlay -->
    <div class="overlay" id="wallet-overlay">
      <div class="overlay-header">
        <h2 id="overlay-title">Wallet Detail</h2>
        <button class="overlay-close" id="overlay-close">Close</button>
      </div>
      <div class="overlay-body" id="overlay-body"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
